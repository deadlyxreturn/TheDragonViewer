name: Media plugins

# Builds the Windows pack of media plugins used by Dragon Viewer, from
# a pinned commit of the Legacy Viewer sources (the Linden Lab binaries, LGPL
# 2.1) and the prebuilt packages that commit names in its autobuild.xml, the
# ones the Legacy Viewer ships:
# - Windows: SLPlugin.exe, media_plugin_cef.dll (web through CEF / Dullahan),
#   media_plugin_libvlc.dll (video and audio through LibVLC);
# - Linux: SLPlugin, libmedia_plugin_cef.so, libmedia_plugin_gstreamer.so.
#   That commit builds no LibVLC plugin for Linux and there is no Linux VLC
#   package: video goes through the system's GStreamer, as in the Legacy
#   Viewer.
# - macOS (universal, arm64 and x86_64, as the Legacy Viewer builds it):
#   SLPlugin.app with media_plugin_cef.dylib, media_plugin_libvlc.dylib, CEF's
#   framework, the Dullahan helpers and LibVLC in its Contents/Frameworks,
#   signed ad hoc.
# Run by hand: the packs only change with these pins. With "publish", both
# packs go to the release media-plugins-<PACK_VERSION>, whose size and SHA-256
# the viewer then pins per system (prototype-updater media_pack.rs). Publish
# from main: GitHub refuses this workflow's token a tag on a commit that
# changes workflow files, as a branch that edits this file does (pack 2 was
# built on such a branch and its artifacts published by hand).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packs as the release media-plugins-<PACK_VERSION>
        type: boolean
        default: false

permissions:
  contents: write

env:
  PACK_VERSION: '1'
  FIRESTORM_SHA: c33bfee253160cceefdb7c98d864fbb736e8ed9a
  BUILD_VARIABLES_SHA: c17312d38377c003977cf5b6dcc83c6042eba194
  AUTOBUILD_VSVER: '170'
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/fs-vars/variables

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # short folder names: the build tree of the viewer has long paths
      - name: Legacy Viewer sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FirestormViewer/phoenix-firestorm
          ref: ${{ env.FIRESTORM_SHA }}
          path: fs
      - name: Legacy Viewer build variables
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FirestormViewer/fs-build-variables
          ref: ${{ env.BUILD_VARIABLES_SHA }}
          path: fs-vars
      # a pack is never replaced: viewers pin its archive
      - name: Release still free
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "media-plugins-$env:PACK_VERSION" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "media-plugins-$env:PACK_VERSION is already published: raise PACK_VERSION" }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Autobuild
        run: python -m pip install -r fs/requirements.txt
      # the open-source configuration: no KDU, FMOD nor Havok
      - name: Configure
        shell: bash
        working-directory: fs
        run: autobuild configure -c ReleaseFS_open -A 64
      - name: Build the launcher and the two plugins
        shell: pwsh
        working-directory: fs
        run: cmake --build build-vc170-64 --config Release --parallel --target SLPlugin media_plugin_cef media_plugin_libvlc
      - name: Package
        shell: pwsh
        run: |
          $dir = "Prototype-Media-Plugins-$env:PACK_VERSION-windows-x64"
          ./scripts/package-media-plugins.ps1 -Source fs -Build fs/build-vc170-64 -Out $dir -Version $env:PACK_VERSION
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          $hash = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content -LiteralPath "$dir.zip.sha256" -Encoding utf8NoBOM
          "{0}: {1} bytes, sha256 {2}" -f "$dir.zip", (Get-Item "$dir.zip").Length, $hash
          # the corresponding source of the LGPL binaries, published with them
          $src = "Prototype-Media-Plugins-$env:PACK_VERSION-source.tar.gz"
          git -C fs archive --format=tar.gz --prefix="phoenix-firestorm-$env:FIRESTORM_SHA/" -o "../$src" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          "PACK=$dir.zip" >> $env:GITHUB_ENV
          "SOURCE=$src" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-plugins-windows
          path: |
            ${{ env.PACK }}
            ${{ env.PACK }}.sha256
            ${{ env.SOURCE }}
          compression-level: 0

  publish:
    if: inputs.publish
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: media-plugins-*
          merge-multiple: true
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "media-plugins-$env:PACK_VERSION"
          $windows = "Prototype-Media-Plugins-$env:PACK_VERSION-windows-x64.zip"
          $source = "Prototype-Media-Plugins-$env:PACK_VERSION-source.tar.gz"
          $notes = "Web and media support for Dragon Viewer (Windows x64), pack $env:PACK_VERSION. The viewer downloads it by itself when web pages or media need it. Built from FirestormViewer/phoenix-firestorm@$env:FIRESTORM_SHA (LGPL 2.1, source attached). This is not a viewer release."
          $notes | Set-Content -LiteralPath notes.md -Encoding utf8NoBOM
          gh release create $tag $windows "$windows.sha256" $source --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Media plugins $env:PACK_VERSION" --notes-file notes.md --latest=false
