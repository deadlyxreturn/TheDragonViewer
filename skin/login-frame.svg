<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 476" preserveAspectRatio="none">
  <defs>
    <linearGradient id="gold" x2=".8" y2="1">
      <stop stop-color="#fffdd4"/><stop offset=".18" stop-color="#ffb437"/>
      <stop offset=".35" stop-color="#fffaac"/><stop offset=".51" stop-color="#ff980b"/>
      <stop offset=".67" stop-color="#ffca25"/><stop offset=".83" stop-color="#fff7c6"/>
      <stop offset="1" stop-color="#ffab0c"/>
