    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#fff6b5"/><stop offset=".22" stop-color="#e46b06"/>
      <stop offset=".5" stop-color="#ffdb60"/><stop offset=".7" stop-color="#a33202"/>
      <stop offset="1" stop-color="#fff9c8"/>
